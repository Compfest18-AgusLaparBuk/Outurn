name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install uv
        run: python -m pip install uv==0.10.0

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --locked --extra dev

      - name: Lint backend
        working-directory: backend
        run: uv run ruff check app tests

      - name: Test backend
        working-directory: backend
        run: uv run pytest --cov=app --cov-report=term-missing --cov-fail-under=80

      - name: Audit Python dependencies
        working-directory: backend
        run: uv tool run pip-audit .

      - name: Run Semgrep
        run: uv tool run semgrep scan --config p/default --error --metrics=off backend/app frontend/app frontend/components frontend/lib

      - name: Migration smoke test
        working-directory: backend
        env:
          DATABASE_URL: sqlite:////tmp/outurn-ci.db
        run: rm -f /tmp/outurn-ci.db && uv run alembic upgrade head

      - name: Run extraction evaluation
        working-directory: backend
        run: uv run python ../evaluation/run.py

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --include=dev

      - name: Test frontend
        working-directory: frontend
        run: npm test

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Audit production npm dependencies
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

      - name: Prepare compose environment
        run: cp .env.example .env

      - name: Validate development Compose
        run: docker compose config

      - name: Validate production Compose
        env:
          APP_API_KEY: ci-service-key-012345678901234567890123456789
          APP_PUBLIC_ORIGIN: https://outurn.example.com
          POSTGRES_PASSWORD: ci-postgres-password
          SEED_USER_1_EMAIL: admin@outurn.local
          SEED_USER_1_PASSWORD: ci-seed-password-1
          SEED_USER_1_DISPLAY_NAME: Outurn Admin
          SEED_USER_1_ROLE: admin
          SEED_USER_2_EMAIL: operator@outurn.local
          SEED_USER_2_PASSWORD: ci-seed-password-2
          SEED_USER_2_DISPLAY_NAME: Outurn Operator
          SEED_USER_2_ROLE: operator
        run: docker compose -f docker-compose.prod.yml config

      - name: Validate Azure deployment
        run: |
          bash -n infra/outurn-deploy.sh
          bash -n infra/bootstrap-outurn-azure.sh
          test -f infra/outurn-deploy.service
          test -f infra/outurn-deploy.timer

      - name: Remove temporary compose environment
        if: always()
        run: rm -f .env

  supply-chain:
    name: Supply-chain security
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Scan tracked secrets
        run: >-
          docker run --rm
          -v "${GITHUB_WORKSPACE}:/repo:ro"
          zricethezav/gitleaks:v8.23.3
          detect --source=/repo --redact --no-banner --exit-code=1

      - name: Scan repository with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          path: .
          artifact-name: outurn-source-sbom
          output-file: outurn-source.spdx.json

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Build backend image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: backend/Dockerfile
          load: true
          tags: outurn-backend:ci

      - name: Scan backend image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: outurn-backend:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          vuln-type: os,library
          exit-code: "1"
          skip-setup-trivy: true

      - name: Build frontend image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: frontend/Dockerfile
          load: true
          tags: outurn-frontend:ci

      - name: Scan frontend image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: outurn-frontend:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          vuln-type: os,library
          exit-code: "1"
          skip-setup-trivy: true
